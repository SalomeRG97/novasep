<svg viewBox="0 0 600 680" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" class="map-colombia-svg">
  <defs>
    <filter id="glow-red-node" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="colombia-fill-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cc0000" stop-opacity="0.22" />
      <stop offset="40%" stop-color="#aa0000" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#400000" stop-opacity="0.06" />
    </linearGradient>
  </defs>

  <style>
    .map-grid-line { stroke: rgba(255,255,255,0.04); stroke-width: 1; stroke-dasharray: 4,6; }
    .colombia-main-path {
      fill: url(#colombia-fill-grad);
      stroke: #cc0000;
      stroke-width: 2;
      stroke-linejoin: round;
      stroke-linecap: round;
      filter: drop-shadow(0 0 10px rgba(204,0,0,0.3));
      transition: fill 0.3s;
    }
    .map-marker-item { cursor: pointer; pointer-events: all; }
    .hit-area { fill: rgba(0,0,0,0.001); stroke: transparent; cursor: pointer; pointer-events: all; }
    .map-marker-item:hover .marker-circle-inner, .map-marker-item.active .marker-circle-inner { fill: #ff4d4d; transform: scale(1.4); }
    .map-marker-item:hover .marker-pulse-ring, .map-marker-item.active .marker-pulse-ring { stroke: #ff4d4d; stroke-width: 2.8; }
    .marker-circle-inner { transition: transform 0.22s var(--ease, ease), fill 0.22s; transform-origin: center; pointer-events: none; }
    .marker-pulse-ring { animation: pulseRing 2.2s infinite ease-out; transform-origin: center; pointer-events: none; }
    .marker-pulse-sede { animation: pulseRingSede 1.7s infinite ease-out; transform-origin: center; pointer-events: none; }
    
    @keyframes pulseRing {
      0% { r: 4px; opacity: 0.85; stroke-width: 1.5px; }
      70% { r: 14px; opacity: 0.15; stroke-width: 2.5px; }
      100% { r: 18px; opacity: 0; stroke-width: 0.5px; }
    }
    @keyframes pulseRingSede {
      0% { r: 6px; opacity: 0.95; stroke-width: 2px; }
      70% { r: 20px; opacity: 0.2; stroke-width: 3.5px; }
      100% { r: 26px; opacity: 0; stroke-width: 0.5px; }
    }
  </style>

  <!-- Background Grid -->
  <g aria-hidden="true">
    <line x1="40" y1="120" x2="560" y2="120" class="map-grid-line" />
    <line x1="40" y1="220" x2="560" y2="220" class="map-grid-line" />
    <line x1="40" y1="320" x2="560" y2="320" class="map-grid-line" />
